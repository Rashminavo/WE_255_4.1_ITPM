name: ragsafe_sl
description: RagSafe - Anti-Ragging App with Education Hub & User Dashboard

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI & Design
  google_fonts: ^8.0.2
  percent_indicator: ^4.2.3
  cupertino_icons: ^1.0.8
  
  # Firebase Services
  firebase_core: ^4.6.0
  firebase_auth: ^6.3.0
  firebase_storage: ^13.2.0
  cloud_firestore: ^6.2.0
  js: ^0.7.2
  
  # Reporting & SOS Features
  image_picker: ^1.1.2
  geolocator: ^14.0.2
  shake: ^3.0.0
  url_launcher: ^6.3.2
  supabase_flutter: ^2.12.1
  cloudinary_sdk: ^5.0.0+1
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true