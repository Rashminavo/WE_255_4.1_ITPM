name: ragsafe_sl
description: RagaSafe + PeerBuddy - Integrated Anti-Ragging & Peer Mentoring Platform

publish_to: 'none'

version: 2.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Firebase Services (compatible versions)
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  firebase_storage: ^12.1.1
  cloud_firestore: ^5.4.0
  firebase_messaging: ^15.2.10
  
  # State Management
  provider: ^6.1.2
  rxdart: ^0.28.0
  
  # Navigation & UI
  go_router: ^13.2.0
  google_fonts: ^8.0.2
  
  # Chat UI Components
  flutter_chat_ui: ^1.6.12
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.1.0
  
  # Chat & Encryption
  encrypt: ^5.0.3
  pointycastle: ^3.7.4
  
  # Progress Indicators & UI
  percent_indicator: ^4.2.3
  cupertino_icons: ^1.0.8
  
  # Calendar & Notifications
  table_calendar: ^3.1.0
  flutter_local_notifications: ^17.1.0
  timezone: ^0.9.4
  
  # File Handling & Media
  image_picker: ^1.1.2
  file_picker: ^8.0.2
  open_file: ^3.3.2
  path_provider: ^2.1.3
  
  # Maps & Location
  geolocator: ^14.0.2
  shake: ^3.0.0
  
  # Secure Storage & Utils
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.0.0
  uuid: ^4.3.3
  intl: ^0.19.0
  
  # Connectivity & Launch
  connectivity_plus: ^6.0.3
  permission_handler: ^11.3.1
  url_launcher: ^6.3.2
  
  # Media & Utilities
  cloudinary_sdk: ^5.0.0+1
  http: ^1.2.0
  js: ^0.6.3
  supabase_flutter: ^2.12.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  
